<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>montagsplausch – die Rezeptsammlung</title>
<meta name="description" content="684 Rezepte aus zehn Jahren Montagskochen in Basel, 2003–2013.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Farben & Schrift ---------- */
:root{
  --paper:#EEF0E9; --paper-2:#E1E5DA; --paper-3:#D2D8CB; --ink:#16211B; --ink-2:#55655B; --line:#C8CFC2;
  --green:#1F5B3E; --green-dark:#164430; --apple:#7FB23A; --wine:#6E2B48;
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--apple);outline-offset:3px}
img{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media(max-width:600px){.wrap{padding:0 18px}}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:0}

/* ---------- Kopf ---------- */
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .wrap{display:flex;align-items:baseline;gap:28px;padding:16px 28px;flex-wrap:wrap}
@media(max-width:600px){.top .wrap{padding:14px 18px;gap:14px}}
.brand{font-family:var(--serif);font-weight:600;font-size:1.4rem;letter-spacing:-.01em;color:var(--ink)}
.brand:hover{text-decoration:none}
.top nav{display:flex;gap:22px;margin-left:auto;font-size:.95rem}
.top nav a.on{color:var(--ink);border-bottom:2px solid var(--apple)}

/* ---------- Äpfel (Wertung 1–6, wie damals) ---------- */
.apples{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}
.apples i{display:inline-block;width:13px;height:13px;border-radius:45% 45% 50% 50%;background:var(--apple);position:relative}
.apples i::after{content:"";position:absolute;left:6px;top:-3px;width:2px;height:4px;background:var(--green);border-radius:1px}
.apples i.half{background:linear-gradient(90deg,var(--apple) 50%,var(--paper-3) 50%)}
.apples b{font-weight:500;font-size:.85rem;color:var(--ink-2);margin-left:6px}
.apples.sm i{width:9px;height:9px}
.apples.sm i::after{left:4px;top:-2px;height:3px}

/* ---------- Startseite ---------- */
.lead{padding:48px 0 24px;display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap}
.lead h1{font-size:clamp(2.2rem,5.2vw,3.9rem);max-width:15ch;flex:1 1 380px}
.lead p{color:var(--ink-2);margin:0;max-width:44ch;flex:1 1 300px;font-size:1.05rem}
.tools{background:var(--paper);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:22px}
@media(min-width:760px){.tools{position:sticky;top:0;z-index:5}}
.tools .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input{flex:1 1 280px;font:inherit;font-size:1.05rem;padding:11px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);min-width:0}
.tools input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(31,91,62,.15)}
.dice{padding:11px 16px;border:1.5px solid var(--green);border-radius:var(--r);background:var(--green);color:#fff;cursor:pointer;white-space:nowrap}
.dice:hover{background:var(--green-dark)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cats button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:.9rem;color:var(--ink)}
.cats button:hover{background:var(--paper-2)}
.cats button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cats button.veg[aria-pressed=true]{background:var(--green);border-color:var(--green)}
.cats .n{opacity:.55;margin-left:5px;font-size:.8rem}
.count{color:var(--ink-2);font-size:.9rem;margin:0 0 16px}
.count a{margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px;margin:0 0 60px;padding:0;list-style:none}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:20px 14px}}
.card{display:block;color:var(--ink)}
.card:hover{text-decoration:none}
.card:hover .t{text-decoration:underline;text-underline-offset:3px}
.card .ph{aspect-ratio:4/3;background:var(--paper-2);border-radius:var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph span{font-family:var(--serif);font-size:3.4rem;color:var(--paper-3);font-weight:600;line-height:1}
.card .t{font-family:var(--serif);font-size:1.12rem;font-weight:500;line-height:1.25;margin:10px 0 4px;letter-spacing:-.01em;display:block}
.card .m{font-size:.82rem;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:40px 0 80px;color:var(--ink-2)}

/* ---------- Rezept ---------- */
.back{display:inline-block;margin:26px 0 30px;font-size:.92rem}
.rz{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:34px 60px;padding-bottom:50px}
.rz.no-img{grid-template-columns:minmax(0,1fr)}
@media(max-width:820px){.rz{grid-template-columns:minmax(0,1fr);gap:26px}}
.rz-head{grid-column:1/-1}
.rz-head .k{font-size:.9rem;color:var(--ink-2);margin-bottom:8px}
.rz-head .k a{color:var(--ink-2)}
.rz-head h1{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:14px;max-width:22ch}
.rz .txt{max-width:64ch;font-size:1.05rem}
.rz .txt p{margin:0 0 1em}
.rz .txt p:last-child{margin-bottom:0}
.rz figure{margin:0;position:sticky;top:24px;align-self:start}
@media(max-width:820px){.rz figure{position:static;order:-1;max-width:560px}}
.rz figure img{border-radius:var(--r);width:100%}
.rz figcaption{font-size:.8rem;color:var(--ink-2);margin-top:6px}
.abend{border-top:1px solid var(--line);padding:30px 0 60px;max-width:64ch}
.abend h2{font-size:1.4rem;font-weight:600;margin-bottom:6px}
.abend .when{color:var(--ink-2);margin:0 0 18px}
.abend dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 18px}
@media(max-width:480px){.abend dl{grid-template-columns:1fr;gap:2px 0}.abend dt{margin-top:8px}}
.abend dt{color:var(--ink-2);font-size:.88rem;padding-top:2px}
.abend dd{margin:0}
.abend ul{margin:0;padding:0;list-style:none}
.abend ul li{padding-left:14px;text-indent:-14px}
.abend ul li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wine);margin-right:6px;vertical-align:1px}
.more{display:flex;flex-wrap:wrap;gap:8px}
.more a{font-size:.9rem;padding:4px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}
.more a:hover{background:var(--paper-2);text-decoration:none}

/* ---------- Getränke, Über ---------- */
.hero{padding:52px 0 30px}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.9rem);margin-bottom:16px;max-width:16ch}
.hero p{font-size:1.1rem;max-width:60ch;color:var(--ink-2);margin:0}
.idx ul{list-style:none;margin:0 0 60px;padding:0;columns:2;column-gap:40px}
@media(max-width:640px){.idx ul{columns:1}}
.idx li{break-inside:avoid;padding:6px 0;border-top:1px solid var(--line)}
.idx li b{font-weight:500}
.idx li .s{color:var(--ink-2);font-size:.85rem;display:block}
.idx li .s a{margin-right:8px}
.about{max-width:64ch;padding:0 0 60px;color:var(--ink-2)}
.about p{margin:0 0 1em}
footer{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--ink-2);font-size:.88rem}
.loading{padding:80px 0;color:var(--ink-2)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="#/">montagsplausch</a>
<nav><a href="#/" data-nav="home">Rezepte</a><a href="#/getraenke" data-nav="getraenke">Getränke</a><a href="#/ueber" data-nav="ueber">Über</a></nav>
</div></header>
<main class="wrap" id="app"><p class="loading">Rezepte werden geladen …</p></main>
<footer><div class="wrap">montagsplausch.ch, 2003–2013. Benjamin Leuzinger &amp; Gabriel Tenger, Basel. Rezeptsammlung, statisch archiviert.</div></footer>

<script>
(function(){
  var app=document.getElementById('app'), D=null, R=[], BY={}, EV={};
  var MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var TAG=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  var listScroll=0, listHash='#/';

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function norm(s){return (s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[éèê]/g,'e');}
  function fmtRating(r){return String(r).replace('.',',');}
  function apples(r,small){
    if(r==null) return '';
    var full=Math.floor(r), half=r-full>=.5, out='';
    for(var i=0;i<full;i++) out+='<i></i>'; if(half) out+='<i class="half"></i>';
    return '<span class="apples'+(small?' sm':'')+'" title="'+fmtRating(r)+' von 6 Äpfeln">'+out+(small?'':'<b>'+fmtRating(r)+' von 6</b>')+'</span>';
  }
  function fmtDate(iso){var d=new Date(iso+'T12:00:00');return TAG[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear();}
  function paras(t){return t.split(/\n\n+/).filter(function(p){return p.trim();}).map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';}).join('');}
  function setNav(k){document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.dataset.nav===k);});}

  /* ---- Startseite ---- */
  function renderList(params){
    setNav('home');
    var n_img=R.filter(function(r){return r.bild;}).length;
    var cats=D.kategorien.map(function(c){return '<button data-c="'+esc(c.slug)+'" aria-pressed="false">'+esc(c.name)+'<span class="n">'+c.n+'</span></button>';}).join('');
    var cards=R.map(function(r){
      var ph=r.bild?'<span class="ph"><img src="assets/bilder/'+esc(r.bild)+'" alt="" loading="lazy"></span>':'<span class="ph"><span>'+esc(r.titel.charAt(0).toUpperCase())+'</span></span>';
      return '<li><a class="card" href="#/rezept/'+esc(r.slug)+'" data-i="'+r.i+'">'+ph+'<span class="t">'+esc(r.titel)+'</span><span class="m">'+apples(r.wertung,true)+'<span>'+esc(r.kategorie)+'</span></span></a></li>';
    }).join('');
    app.innerHTML=
      '<section class="lead"><h1>'+R.length+' Rezepte aus zehn Jahren Montagskochen.</h1>'+
      '<p>Von '+D.jahre[0]+' bis '+D.jahre[1]+' haben Beni und Gäbi in Basel jeden Montag gekocht und alles aufgeschrieben, '+n_img+' Gerichte auch fotografiert. Hier ist die ganze Sammlung, nach Rezept statt nach Datum.</p></section>'+
      '<div class="tools"><div class="row"><input id="q" type="search" placeholder="Rezept, Zutat oder Gast suchen …" autocomplete="off" aria-label="Rezepte durchsuchen"><button class="dice" id="dice" type="button">Was kochen? Zufallsrezept</button></div>'+
      '<div class="cats"><button data-c="" aria-pressed="true">Alle</button>'+cats+'<button class="veg" data-c="vegi" aria-pressed="false">Vegetarisch<span class="n">'+D.n_vegi+'</span></button></div></div>'+
      '<p class="count" id="count"></p><ul class="grid" id="grid">'+cards+'</ul>'+
      '<p class="empty" id="empty" style="display:none">Nichts gefunden. Andere Schreibweise probieren oder den Filter zurücksetzen.</p>';

    var q=document.getElementById('q'), cnt=document.getElementById('count'), empty=document.getElementById('empty'),
        btns=document.querySelectorAll('.cats button'), items=document.querySelectorAll('#grid > li');
    var cat=params.get('k')||'', veg=params.get('vegi')==='1'; q.value=params.get('q')||'';
    btns.forEach(function(b){ if(b.classList.contains('veg')) b.setAttribute('aria-pressed',veg?'true':'false'); else b.setAttribute('aria-pressed',b.dataset.c===cat?'true':'false'); });

    function run(){
      var terms=norm(q.value.trim()).split(/\s+/).filter(Boolean), n=0;
      items.forEach(function(li,i){
        var r=R[i], ok=true;
        if(cat && r.kategorien_slug.indexOf(cat)<0) ok=false;
        if(ok && veg && !r.vegetarisch) ok=false;
        if(ok && terms.length){ var h=r._s; ok=terms.every(function(t){return h.indexOf(t)>=0;}); }
        li.style.display=ok?'':'none'; if(ok)n++;
      });
      var active=terms.length||cat||veg;
      cnt.innerHTML=active?n+' von '+R.length+' Rezepten <a href="#/" id="reset">alle zeigen</a>':R.length+' Rezepte';
      empty.style.display=n?'none':'';
      var p=new URLSearchParams(); if(q.value.trim())p.set('q',q.value.trim()); if(cat)p.set('k',cat); if(veg)p.set('vegi','1');
      var s=p.toString(); listHash='#/'+(s?'?'+s:''); history.replaceState(null,'',listHash);
    }
    btns.forEach(function(b){b.addEventListener('click',function(){
      if(b.classList.contains('veg')){veg=!veg;b.setAttribute('aria-pressed',veg?'true':'false');}
      else{cat=b.dataset.c;btns.forEach(function(x){if(!x.classList.contains('veg'))x.setAttribute('aria-pressed',x===b?'true':'false');});}
      run();
    });});
    q.addEventListener('input',run);
    document.getElementById('dice').addEventListener('click',function(){
      var vis=[]; items.forEach(function(li,i){if(li.style.display!=='none')vis.push(R[i]);});
      if(vis.length) location.hash='#/rezept/'+vis[Math.floor(Math.random()*vis.length)].slug;
    });
    run();
    window.scrollTo(0,listScroll);
  }

  /* ---- Rezept ---- */
  function renderRecipe(slug){
    setNav('home');
    var r=BY[slug]; if(!r){app.innerHTML='<a class="back" href="'+listHash+'">Alle Rezepte</a><p class="empty">Dieses Rezept gibt es nicht.</p>';return;}
    var e=EV[r.abend]; document.title=r.titel+' – montagsplausch';
    var fig=r.bild?'<figure><img src="assets/bilder/'+esc(r.bild)+'" alt="'+esc(r.titel)+'">'+(r.original?'<figcaption>Foto vom Abend</figcaption>':'')+'</figure>':'';
    var meta='';
    if(e.wetter) meta+='<dt>Wetter</dt><dd>'+esc(e.wetter)+'</dd>';
    if(e.getraenke.length) meta+='<dt>Getränke</dt><dd><ul>'+e.getraenke.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'</ul></dd>';
    if(e.anwesend) meta+='<dt>Am Tisch</dt><dd>'+esc(e.anwesend)+'</dd>';
    var sibs=e.rezepte.filter(function(s){return s!==slug;});
    if(sibs.length) meta+='<dt>Dazu gab es</dt><dd><div class="more">'+sibs.map(function(s){return '<a href="#/rezept/'+esc(s)+'">'+esc(BY[s].titel)+'</a>';}).join('')+'</div></dd>';
    var evTitle=(e.titel.trim().toLowerCase()===r.titel.trim().toLowerCase())?'':' Der Abend hiess «'+esc(e.titel)+'».';
    var txt=r.text.trim()?paras(r.text):'<p><i>Zu diesem Rezept wurde damals kein Text notiert.</i></p>';
    app.innerHTML=
      '<a class="back" href="'+listHash+'">Alle Rezepte</a>'+
      '<article class="rz'+(fig?'':' no-img')+'"><header class="rz-head"><div class="k"><a href="#/?k='+esc(r.kategorie_slug)+'">'+esc(r.kategorie)+'</a>'+(r.vegetarisch?' &nbsp;|&nbsp; <a href="#/?vegi=1">vegetarisch</a>':'')+'</div>'+
      '<h1>'+esc(r.titel)+'</h1>'+apples(r.wertung)+'</header><div class="txt">'+txt+'</div>'+fig+'</article>'+
      '<section class="abend"><h2>Gekocht am '+fmtDate(e.datum)+'</h2><p class="when">Montagsplausch Nr. '+e.nr+'.'+evTitle+'</p><dl>'+meta+'</dl></section>';
    window.scrollTo(0,0);
  }

  /* ---- Getränke ---- */
  function renderDrinks(){
    setNav('getraenke'); document.title='Getränke – montagsplausch';
    var lis=D.getraenke.map(function(g){
      return '<li><b>'+esc(g.name)+'</b><span class="s">'+g.abende.map(function(nr){var e=EV[nr];return '<a href="#/rezept/'+esc(e.rezepte[0])+'">'+e.datum.slice(0,4)+'</a>';}).join('')+'</span></li>';
    }).join('');
    app.innerHTML='<section class="hero"><h1>Was getrunken wurde.</h1><p>'+D.getraenke.length+' verschiedene Getränke an '+D.n_abende_mit_getraenk+' Montagen, so wie sie damals notiert wurden. Der Link führt zum jeweiligen Menü.</p></section><div class="idx"><ul>'+lis+'</ul></div>';
    window.scrollTo(0,0);
  }

  /* ---- Über ---- */
  function renderAbout(){
    setNav('ueber'); document.title='Über – montagsplausch';
    app.innerHTML='<section class="hero"><h1>Die Idee.</h1></section><div class="about">'+paras(D.ueber)+'</div>'+
      '<div class="about"><p>Diese Seite ist die Rezeptsammlung von montagsplausch.ch: '+R.length+' Rezepte aus '+D.n_abende+' Montagen zwischen 2003 und 2013, statisch nachgebaut, ohne Datenbank und ohne Gästebuch. Die Texte sind unverändert, inklusive der Tippfehler von damals. Die Kategorien wurden nachträglich automatisch vergeben.</p></div>';
    window.scrollTo(0,0);
  }

  /* ---- Router ---- */
  function route(){
    if(!D) return;
    var h=location.hash||'#/', m;
    if((m=h.match(/^#\/rezept\/([^?]+)/))){ if(document.getElementById('grid')) listScroll=window.scrollY; renderRecipe(decodeURIComponent(m[1])); return; }
    if(h.indexOf('#/getraenke')===0){ renderDrinks(); return; }
    if(h.indexOf('#/ueber')===0){ renderAbout(); return; }
    document.title='montagsplausch – die Rezeptsammlung';
    var qi=h.indexOf('?'); renderList(new URLSearchParams(qi>=0?h.slice(qi+1):''));
  }
  window.addEventListener('hashchange',route);

  fetch('assets/rezepte.json').then(function(x){return x.json();}).then(function(d){
    D=d; R=d.rezepte;
    R.forEach(function(r,i){
      r.i=i; BY[r.slug]=r;
      var e=d.abende[r.abend];
      r._s=norm(r.titel+' '+e.titel+' '+r.text+' '+e.anwesend+' '+e.getraenke.join(' '));
    });
    EV=d.abende;
    route();
  }).catch(function(err){ app.innerHTML='<p class="empty">Die Rezepte konnten nicht geladen werden ('+esc(err.message)+').</p>'; });
})();
</script>
</body>
</html>
