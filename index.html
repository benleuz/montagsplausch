<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>montagsplausch – die Rezeptsammlung</title>
<meta name="description" content="684 Rezepte aus zehn Jahren Montagskochen in Basel, 2003–2013.">
<meta name="theme-color" content="#12140F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12140F; --bg-2:#1A1D16; --bg-3:#1F231A; --line:#2A2E24; --dim:#3A4030;
  --fg:#EDEFE6; --fg-2:#DDE0D4; --fg-3:#C6CBBB; --mute:#9AA28D; --mute-2:#7C8471;
  --acid:#B9E04C; --acid-2:#CCEE66;
  --sans:Archivo,Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1500px;margin:0 auto;padding:0 22px}
a{color:var(--acid);text-decoration:none}
a:hover{color:var(--acid-2);text-decoration:underline;text-underline-offset:3px}
::selection{background:var(--acid);color:var(--bg)}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2{margin:0;font-weight:700;letter-spacing:-.035em;line-height:1}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute-2)}

/* Kopf */
.top{position:sticky;top:0;z-index:20;background:rgba(18,20,15,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@media(max-width:760px){.top{position:static}}
.top .bar{max-width:1500px;margin:0 auto;padding:12px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-size:15.5px;font-weight:700;letter-spacing:-.015em;color:var(--fg);white-space:nowrap}
.brand:hover{text-decoration:none;color:var(--fg)}
.brand span{color:var(--acid)}
.top nav{display:flex;gap:14px;font-size:13px}
.top nav a{color:var(--mute);padding-bottom:2px;border-bottom:1.5px solid transparent}
.top nav a:hover{text-decoration:none;color:var(--fg)}
.top nav a.on{color:var(--fg);border-bottom-color:var(--acid)}
.top input{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;padding:9px 13px;border:1px solid var(--line);border-radius:4px;background:var(--bg-2);color:var(--fg);outline:none}
.top input:focus{border-color:var(--acid)}
.top input::placeholder{color:var(--mute-2)}
.dice{font-size:13px;font-weight:600;padding:9px 15px;border-radius:4px;background:var(--acid);color:var(--bg);white-space:nowrap}
.dice:hover{background:var(--acid-2)}
.filters{max-width:1500px;margin:0 auto;padding:0 22px 11px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filters[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 11px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--mute);display:flex;align-items:center}
.chips button:hover{color:var(--fg)}
.chips button[aria-pressed=true]{background:var(--acid);color:var(--bg);border-color:var(--acid);font-weight:600}
.chips .n{opacity:.55;margin-left:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:0}
.sorts{display:flex;gap:12px;align-items:center;margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute-2);letter-spacing:.06em}
.sorts button{color:var(--mute-2);font-family:inherit;font-size:inherit;letter-spacing:inherit}
.sorts button:hover{color:var(--fg)}
.sorts button.on{color:var(--acid)}

/* Liste */
.lead{padding:40px 0 26px;display:flex;gap:34px;align-items:flex-end;flex-wrap:wrap}
.lead h1{font-size:clamp(30px,4.4vw,58px);line-height:.98;flex:1 1 400px;max-width:18ch;text-wrap:pretty}
.lead p{margin:0;flex:1 1 280px;max-width:42ch;color:var(--mute);font-size:15.5px;line-height:1.6;text-wrap:pretty}
.grid{margin:0 0 30px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
.tile{position:relative;aspect-ratio:1/1;border-radius:4px;overflow:hidden;background:var(--bg-2);display:block;color:var(--fg)}
.tile:hover{outline:2px solid var(--acid);outline-offset:-2px;text-decoration:none;color:var(--fg)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nf{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.1em}
.tile .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,20,15,0) 34%,rgba(18,20,15,.9) 100%)}
.tile .cap{position:absolute;left:12px;right:12px;bottom:11px}
.tile .t{font-size:15.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:pretty}
.tile .m{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.tile .y{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.pips{display:inline-flex;gap:2px}
.pips i{display:inline-block;width:8px;height:8px;border-radius:46% 46% 50% 50%;background:var(--acid)}
.pips i.half{background:linear-gradient(90deg,var(--acid) 50%,var(--dim) 50%)}
.pips i.off{background:var(--dim)}
.pips.lg{gap:3px}.pips.lg i{width:11px;height:11px}
.more{margin:30px auto 70px;width:fit-content;padding:11px 22px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-weight:500;display:block}
.more:hover{border-color:var(--acid);color:var(--acid)}
.empty{padding:40px 0 90px;color:var(--mute-2);margin:0}
.spacer{height:70px}

/* Rezept */
.rzbar{display:flex;gap:18px;align-items:center;margin:22px 0;flex-wrap:wrap;font-size:13px}
.rzbar .rnd{color:var(--mute-2)}.rzbar .rnd:hover{color:var(--acid)}
.rz{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:34px 46px;padding-bottom:40px;align-items:start}
.rz.no-img{grid-template-columns:minmax(0,1fr)}
@media(max-width:860px){.rz{grid-template-columns:minmax(0,1fr);gap:24px}}
.rz>img{width:100%;border-radius:5px;position:sticky;top:112px}
@media(max-width:860px){.rz>img{position:static;max-width:560px}}
.rz .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acid)}
.rz h1{margin:10px 0 12px;font-size:clamp(28px,4vw,46px);letter-spacing:-.03em;line-height:1.04;text-wrap:pretty}
.rz .w{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:26px}
.rz .txt{font-size:16.5px;line-height:1.66;max-width:60ch;color:var(--fg-2)}
.rz .txt p{margin:0 0 1em;white-space:pre-line;text-wrap:pretty}
.abend{border-top:1px solid var(--line);margin-top:30px;padding-top:24px}
.abend h2{font-size:18px;font-weight:600;letter-spacing:0;margin-bottom:4px}
.abend .sub{margin:0 0 20px;color:var(--mute);font-size:14.5px}
.abend dl{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px 18px}
@media(max-width:480px){.abend dl{grid-template-columns:1fr;gap:2px 0}.abend dt{margin-top:8px}}
.abend dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute-2);padding-top:4px}
.abend dd{margin:0;font-size:15.5px}
.sibs{margin-top:20px}
.sibs .mono{margin-bottom:9px;display:block}
.pillrow{display:flex;flex-wrap:wrap;gap:7px}
.pillrow a{font-size:13.5px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--fg-3)}
.pillrow a:hover{border-color:var(--acid);color:var(--acid);text-decoration:none}

/* Abende, Getränke, Über */
.hero{padding:40px 0 24px}
.hero h1{font-size:clamp(30px,4.4vw,54px);margin-bottom:12px}
.hero p{margin:0;max-width:54ch;color:var(--mute);font-size:15.5px;line-height:1.6}
.year{border-top:1px solid var(--line);padding:20px 0 28px}
.year .yh{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.year h2{font-size:30px;letter-spacing:-.03em}
.year .yl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute-2)}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px 26px}
.ev{display:flex;flex-direction:column;gap:4px}
.ev .d{font-family:var(--mono);font-size:11.5px;color:var(--mute-2)}
.ev .t{font-size:17px;font-weight:600;line-height:1.25}
.ev .pillrow{gap:6px;margin-top:3px}.ev .pillrow a{font-size:13px;padding:3px 10px}
.ev .g{font-size:13px;color:var(--mute);margin-top:3px}
.drinks{columns:3 260px;column-gap:34px;padding-bottom:70px;border-top:1px solid var(--line)}
.drinks .dr{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--bg-3)}
.drinks .dn{font-size:15px;font-weight:500;line-height:1.3}
.drinks .dy{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.drinks .dy a{font-family:var(--mono);font-size:11.5px}
.about{max-width:62ch;font-size:16.5px;line-height:1.66;color:var(--fg-3);padding-bottom:24px}
.about p{margin:0 0 1em;text-wrap:pretty}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px;border-top:1px solid var(--line);padding:26px 0 80px;max-width:900px}
.stats .n{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stats .l{font-size:13px;color:var(--mute);margin-top:5px}
footer{border-top:1px solid var(--line)}
footer div{max-width:1500px;margin:0 auto;padding:22px 22px 40px;color:var(--mute-2);font-size:13px}
.loading{padding:60px 0;color:var(--mute-2)}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#/">montagsplausch<span>.</span></a>
    <nav><a href="#/" data-nav="home">Rezepte</a><a href="#/abende" data-nav="abende">Abende</a><a href="#/getraenke" data-nav="getraenke">Getränke</a><a href="#/ueber" data-nav="ueber">Über</a></nav>
    <input id="q" type="search" placeholder="suchen: zutat, gast, wein …" aria-label="Rezepte durchsuchen" autocomplete="off">
    <button class="dice" id="dice" type="button">Zufall</button>
  </div>
  <div class="filters" id="filters" hidden>
    <div class="chips" id="chips"></div>
    <div class="sorts"><span id="count"></span><button data-s="wertung">Äpfel</button><button data-s="neu">zuletzt</button><button data-s="alpha">A–Z</button></div>
  </div>
</header>
<main id="app"><p class="loading">Rezepte werden geladen …</p></main>
<footer><div>montagsplausch.ch, 2003–2013. Benjamin Leuzinger &amp; Gabriel Tenger, Basel.</div></footer>

<script>
(function(){
  var app=document.getElementById('app'), q=document.getElementById('q'), filters=document.getElementById('filters'),
      chipsEl=document.getElementById('chips'), countEl=document.getElementById('count'), sortBtns=document.querySelectorAll('.sorts button');
  var D=null, R=[], BY={}, EV={};
  var st={q:'',cat:'',vegi:false,foto:false,sort:'wertung',limit:48}, listScroll=0, listHash='#/', view='list';
  var MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function norm(s){return (s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[éèê]/g,'e');}
  function pips(w,lg,full){
    if(w==null) return '';
    var f=Math.floor(w), half=w-f>=.5, out='';
    for(var i=0;i<f;i++) out+='<i></i>'; if(half) out+='<i class="half"></i>';
    if(full) for(var j=f+(half?1:0);j<6;j++) out+='<i class="off"></i>';
    return '<span class="pips'+(lg?' lg':'')+'" title="'+String(w).replace('.',',')+' von 6 Äpfeln">'+out+'</span>';
  }
  function setNav(k){document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.dataset.nav===k);});}
  function paras(t){return t.split(/\n\n+/).filter(function(p){return p.trim();}).map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('');}

  /* ---- Filterlogik ---- */
  function filtered(){
    var terms=norm(st.q.trim()).split(/\s+/).filter(Boolean);
    var l=R.filter(function(r){
      if(st.foto && !r.bild) return false;
      if(st.vegi && !r.vegetarisch) return false;
      if(st.cat && r.kategorien_slug.indexOf(st.cat)<0) return false;
      if(terms.length && !terms.every(function(t){return r._s.indexOf(t)>=0;})) return false;
      return true;
    });
    if(st.sort==='wertung') l.sort(function(a,b){return (b.wertung||0)-(a.wertung||0)||b._nr-a._nr;});
    else if(st.sort==='alpha') l.sort(function(a,b){return a.titel.localeCompare(b.titel,'de');});
    else l.sort(function(a,b){return b._nr-a._nr;});
    return l;
  }
  function syncHash(){
    var p=new URLSearchParams();
    if(st.q.trim())p.set('q',st.q.trim()); if(st.cat)p.set('k',st.cat); if(st.vegi)p.set('vegi','1'); if(st.foto)p.set('foto','1'); if(st.sort!=='wertung')p.set('s',st.sort);
    var s=p.toString(); listHash='#/'+(s?'?'+s:''); history.replaceState(null,'',listHash);
  }
  function renderChips(){
    var chips=[{l:'alle',n:'',on:!st.cat&&!st.vegi&&!st.foto,k:'all'}]
      .concat(D.kategorien.map(function(c){return {l:c.name,n:c.n,on:st.cat===c.slug,k:'c:'+c.slug};}))
      .concat([{l:'vegetarisch',n:D.n_vegi,on:st.vegi,k:'vegi'},{l:'mit Foto',n:D.n_foto,on:st.foto,k:'foto'}]);
    chipsEl.innerHTML=chips.map(function(c){return '<button data-k="'+esc(c.k)+'" aria-pressed="'+c.on+'">'+esc(c.l)+(c.n!==''?'<span class="n">'+c.n+'</span>':'')+'</button>';}).join('');
    sortBtns.forEach(function(b){b.classList.toggle('on',b.dataset.s===st.sort);});
  }
  function renderGrid(keep){
    var list=filtered();
    var cards=list.slice(0,st.limit).map(function(r){
      var img=r.bild?'<img src="assets/bilder/'+esc(r.bild)+'" alt="" loading="lazy">':'<span class="nf">ohne Foto</span>';
      return '<li><a class="tile" href="#/rezept/'+esc(r.slug)+'">'+img+'<span class="sh"></span><span class="cap"><span class="t">'+esc(r.titel)+'</span><span class="m">'+pips(r.wertung)+'<span class="y">'+r._jahr+'</span></span></span></a></li>';
    }).join('');
    var more=list.length>st.limit?'<button class="more" id="more" type="button">weitere '+Math.min(48,list.length-st.limit)+' von '+list.length+' laden</button>':'<div class="spacer"></div>';
    var empty=list.length?'':'<p class="empty">Nichts gefunden. Andere Schreibweise probieren oder die Filter zurücksetzen.</p>';
    document.getElementById('grid').innerHTML=cards;
    document.getElementById('tail').innerHTML=more+empty;
    countEl.textContent=list.length+' Rezepte';
    var m=document.getElementById('more'); if(m) m.addEventListener('click',function(){st.limit+=48;renderGrid(true);});
    renderChips(); syncHash();
    if(!keep) window.scrollTo(0,listScroll);
  }
  function renderList(params){
    view='list'; setNav('home'); filters.hidden=false; document.title='montagsplausch – die Rezeptsammlung';
    st.q=params.get('q')||''; st.cat=params.get('k')||''; st.vegi=params.get('vegi')==='1'; st.foto=params.get('foto')==='1'; st.sort=params.get('s')||'wertung'; st.limit=48; q.value=st.q;
    app.innerHTML='<section class="lead"><h1>Zehn Jahre Montagabend, '+R.length+' Rezepte.</h1><p>'+D.n_abende+' Abende in Basel, '+D.n_foto+' Gerichte fotografiert, bewertet mit einem bis sechs Äpfeln. Die Texte stehen unverändert da, wie damals notiert.</p></section><ul class="grid" id="grid"></ul><div id="tail"></div>';
    renderGrid(false);
  }
  chipsEl.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; var k=b.dataset.k; st.limit=48;
    if(k==='all'){st.cat='';st.vegi=false;st.foto=false;}
    else if(k==='vegi') st.vegi=!st.vegi; else if(k==='foto') st.foto=!st.foto;
    else {var c=k.slice(2); st.cat=st.cat===c?'':c;}
    renderGrid(true);
  });
  sortBtns.forEach(function(b){b.addEventListener('click',function(){st.sort=b.dataset.s;st.limit=48;renderGrid(true);});});
  q.addEventListener('input',function(){
    st.q=q.value; st.limit=48;
    if(view!=='list'){ syncHash(); location.hash=listHash; } else renderGrid(true);
  });
  document.getElementById('dice').addEventListener('click',function(){
    var l=filtered(); if(l.length) location.hash='#/rezept/'+l[Math.floor(Math.random()*l.length)].slug;
  });

  /* ---- Rezept ---- */
  function renderRecipe(slug){
    view='recipe'; setNav('home'); filters.hidden=true;
    var r=BY[slug];
    if(!r){app.innerHTML='<div class="rzbar"><a href="'+listHash+'">← zurück</a></div><p class="empty">Dieses Rezept gibt es nicht.</p>';return;}
    var e=EV[r.abend], dt=new Date(e.datum+'T12:00:00'); document.title=r.titel+' – montagsplausch';
    var meta='';
    if(e.wetter) meta+='<dt>Wetter</dt><dd>'+esc(e.wetter)+'</dd>';
    if(e.getraenke.length) meta+='<dt>Getränke</dt><dd>'+esc(e.getraenke.join(', '))+'</dd>';
    if(e.anwesend) meta+='<dt>Am Tisch</dt><dd>'+esc(e.anwesend)+'</dd>';
    var sibs=e.rezepte.filter(function(s){return s!==slug&&BY[s];});
    var sibHtml=sibs.length?'<div class="sibs"><span class="mono">Dazu gab es</span><div class="pillrow">'+sibs.map(function(s){return '<a href="#/rezept/'+esc(s)+'">'+esc(BY[s].titel)+'</a>';}).join('')+'</div></div>':'';
    var sub='Plausch Nr. '+e.nr+(e.titel.trim().toLowerCase()===r.titel.trim().toLowerCase()?'':' — der Abend hiess «'+esc(e.titel)+'».');
    var txt=r.text.trim()?paras(r.text):'<p>Zu diesem Rezept wurde damals kein Text notiert.</p>';
    var img=r.bild?'<img src="assets/bilder/'+esc(r.bild)+'" alt="'+esc(r.titel)+'">':'';
    app.innerHTML=
      '<div class="rzbar"><a href="'+listHash+'">← zurück</a><a class="rnd" href="#" id="rnd">nächstes zufällig →</a></div>'+
      '<article class="rz'+(img?'':' no-img')+'">'+img+'<div>'+
      '<div class="kicker">'+esc(r.kategorie)+(r.vegetarisch?' · vegetarisch':'')+'</div><h1>'+esc(r.titel)+'</h1>'+
      '<div class="w">'+pips(r.wertung,true,true)+'<span>'+(r.wertung==null?'ohne Bewertung':String(r.wertung).replace('.',',')+' von 6 Äpfeln')+'</span></div>'+
      '<div class="txt">'+txt+'</div>'+
      '<section class="abend"><h2>Montag, '+dt.getDate()+'. '+MON[dt.getMonth()]+' '+dt.getFullYear()+'</h2><p class="sub">'+sub+'</p><dl>'+meta+'</dl>'+sibHtml+'</section>'+
      '</div></article><div class="spacer"></div>';
    document.getElementById('rnd').addEventListener('click',function(ev){ev.preventDefault();var l=filtered();if(l.length)location.hash='#/rezept/'+l[Math.floor(Math.random()*l.length)].slug;});
    window.scrollTo(0,0);
  }

  /* ---- Abende ---- */
  function renderAbende(){
    view='abende'; setNav('abende'); filters.hidden=true; document.title='Abende – montagsplausch';
    var by={}; Object.keys(EV).forEach(function(k){var e=EV[k],y=e.datum.slice(0,4);(by[y]=by[y]||[]).push(e);});
    var html=Object.keys(by).sort().reverse().map(function(y){
      var evs=by[y].sort(function(a,b){return b.datum.localeCompare(a.datum);}).map(function(e){
        return '<div class="ev"><span class="d">'+e.datum.split('-').reverse().join('.')+'</span><span class="t">'+esc(e.titel)+'</span><div class="pillrow">'+
          e.rezepte.filter(function(s){return BY[s];}).map(function(s){return '<a href="#/rezept/'+esc(s)+'">'+esc(BY[s].titel)+'</a>';}).join('')+'</div>'+
          (e.getraenke.length?'<span class="g">'+esc(e.getraenke.join(', '))+'</span>':'')+'</div>';
      }).join('');
      return '<section class="year"><div class="yh"><h2>'+y+'</h2><span class="yl">'+by[y].length+' Abende</span></div><div class="evs">'+evs+'</div></section>';
    }).join('');
    app.innerHTML='<section class="hero"><h1>'+D.n_abende+' Montage, der Reihe nach.</h1><p>Jeder Abend mit Datum, Titel, Menü und dem, was im Glas war.</p></section>'+html+'<div class="spacer"></div>';
    window.scrollTo(0,0);
  }

  /* ---- Getränke ---- */
  function renderDrinks(){
    view='getraenke'; setNav('getraenke'); filters.hidden=true; document.title='Getränke – montagsplausch';
    var html=D.getraenke.map(function(g){
      var ys=g.abende.filter(function(nr){return EV[nr];}).map(function(nr){var e=EV[nr],first=e.rezepte.filter(function(s){return BY[s];})[0];return first?'<a href="#/rezept/'+esc(first)+'">'+e.datum.slice(0,4)+'</a>':'';}).join('');
      return '<div class="dr"><div class="dn">'+esc(g.name)+'</div><div class="dy">'+ys+'</div></div>';
    }).join('');
    app.innerHTML='<section class="hero"><h1>'+D.getraenke.length+' Getränke, so notiert wie damals.</h1><p>Der Jahres-Link führt zum Menü des Abends.</p></section><div class="drinks">'+html+'</div>';
    window.scrollTo(0,0);
  }

  /* ---- Über ---- */
  function renderAbout(){
    view='ueber'; setNav('ueber'); filters.hidden=true; document.title='Über – montagsplausch';
    var ps=D.ueber.split(/\n\n+/).map(function(p){return p.replace(/\s+/g,' ').trim();}).filter(function(p){return p&&p!=='Die Idee';});
    app.innerHTML='<section class="hero"><h1>Die Idee.</h1></section><div class="about">'+ps.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+
      '<p>Diese Sammlung führt '+R.length+' Rezepte aus '+D.n_abende+' Montagen zwischen '+D.jahre[0]+' und '+D.jahre[1]+' zusammen. Die Texte sind unverändert, inklusive der Tippfehler von damals. Die Kategorien wurden nachträglich vergeben.</p></div>'+
      '<div class="stats">'+[[R.length,'Rezepte'],[D.n_abende,'Montage'],[D.n_foto,'Fotos'],[D.getraenke.length,'Getränke']].map(function(s){return '<div><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>';}).join('')+'</div>';
    window.scrollTo(0,0);
  }

  /* ---- Router ---- */
  function route(){
    if(!D) return;
    var h=location.hash||'#/', m;
    if((m=h.match(/^#\/rezept\/([^?]+)/))){ if(view==='list') listScroll=window.scrollY; renderRecipe(decodeURIComponent(m[1])); return; }
    if(h.indexOf('#/abende')===0){ renderAbende(); return; }
    if(h.indexOf('#/getraenke')===0){ renderDrinks(); return; }
    if(h.indexOf('#/ueber')===0){ renderAbout(); return; }
    var qi=h.indexOf('?'); renderList(new URLSearchParams(qi>=0?h.slice(qi+1):''));
  }
  window.addEventListener('hashchange',route);

  fetch('assets/rezepte.json').then(function(x){return x.json();}).then(function(d){
    D=d; R=d.rezepte; EV=d.abende;
    R.forEach(function(r){var e=EV[r.abend]; BY[r.slug]=r; r._jahr=e.datum.slice(0,4); r._nr=e.nr;
      r._s=norm(r.titel+' '+e.titel+' '+r.text+' '+(e.anwesend||'')+' '+e.getraenke.join(' '));});
    D.n_foto=R.filter(function(r){return r.bild;}).length;
    route();
  }).catch(function(err){ app.innerHTML='<p class="empty">Die Rezepte konnten nicht geladen werden ('+esc(err.message)+').</p>'; });
})();
</script>
</body>
</html>
